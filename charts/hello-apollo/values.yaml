replicaCount: 1

config:
  valueFromSecret:
    secretName: super-secret-name
    key: value
    optional: true
  valueFromModuleVariable: module-variable-value
  valueFromEnvironmentConfig: environment-config-value

serviceAccount:
  create: true

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

volumes: []
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
